<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teampro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/event.css">
</head>

<body>
  <div class="container">
    <header>
      <nav class="header__nav">
        <a href="./index.html">
          <img src="./assets/logo.png" alt="" />
        </a>
        <ul class="nav__links">
          <li>
            <a class="nav__links--link" href="#">About Us</a>
          </li>
          <li>
            <a class="nav__links--link" href="./course.html">Courses</a>
          </li>
          <li>
            <a class="nav__links--link" href="./event.html">Events</a>
          </li>
          <li>
            <a class="nav__links--link" href="#">Blog</a>
          </li>
          <li>
            <a class="nav__links--link" href="#">Contacts</a>
          </li>
        </ul>
      </nav>
      <div class="header__btns">
        <button class="header__btns--btn">Get consultation</button>
        <button class="btns__btn--second">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
            <path
              d="M12 2a5 5 0 1 0 0 10 5 5 0 1 0 0-10M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.45 1 1 1">
            </path>
          </svg>
          Log in / Register
        </button>
      </div>
    </header>
    <main>
      <section class="events">
        <div class="events__top">
          <span class="events__top--span">OUR EVENTS</span>
          <h1 class="events__top--title">Lectures, workshops & master-classes</h1>
        </div>
        <div class="events__inputs">
          <div class="events__inputs--themes">
            <p class="events__themes--subtitle">Event category</p>
            <select id="">
              <option>all themes</option>
            </select>
          </div>

          <div class="events__inputs--sort">
            <p class="events__sort--subtitle">Sort by</p>
            <select id="">
              <option>newest</option>
            </select>
          </div>

          <div class="events__inputs--show">
            <p class="events__show--subtitle">Show</p>
            <input type="number" placeholder="9">
            <span class="eventa__show--span">events per page</span>
          </div>

          <div class="events__inputs--search">
            <input type="search" placeholder="Search event... ">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>

          <div class="events__inputs--grid">
            <button class="events__grid--table"><i class="fa-solid fa-table-cells-large"></i></button>
            <button class="events__grid--list"><i class="fa-solid fa-list"></i></button>
          </div>
        </div>
        <div class="grid">
          <div class="grid__list--row">
            <div class="grid__row--date">
              <p class="grid__date--date">05</p>
              <span class="grid__date--span">
                August
                <p class="grid__span--time">11:00 – 14:00</p>
              </span>
            </div>
            <div class="grid__row--text">
              <div>
                <p class="grid__row--subtitle">
                  Formation of the organizational structure of the company in the face of uncertainty.
                </p>
                <span class="grid__subtitle--span">Online master-class</span>
              </div>
            </div>
            <div>
              <button class="grid__row--btn">View more</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
