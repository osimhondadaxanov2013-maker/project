<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teampro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/event.css">
</head>

<body>
  <div class="container">
    <header>
      <nav class="header__nav">
        <a href="./index.html">
          <img src="./assets/logo.png" alt="" />
        </a>
        <ul class="nav__links">
          <li>
            <a class="nav__links--link" href="#">About Us</a>
          </li>
          <li>
            <a class="nav__links--link" href="./course.html">Courses</a>
          </li>
          <li>
            <a class="nav__links--link" href="./event.html">Events</a>
          </li>
          <li>
            <a class="nav__links--link" href="#">Blog</a>
          </li>
          <li>
            <a class="nav__links--link" href="#">Contacts</a>
          </li>
        </ul>
      </nav>
      <div class="header__btns">
        <button class="header__btns--btn">Get consultation</button>
        <button class="btns__btn--second">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">

            </path>
          </svg>
          Log in / Register
        </button>
      </div>
    </header>
    <main>
      <section class="events">
        <div class="events__top">
          <span class="events__top--span">OUR EVENTS</span>
          <h1 class="events__top--title">Lectures, workshops & master-classes</h1>
        </div>
        <div class="events__top--search">
          <select id="events__top--sort">
            <option>newest</option>
          </select>
          <input type="search" placeholder="search event...">
        </div>
      </section>
    </main>
  </div>

</html>
